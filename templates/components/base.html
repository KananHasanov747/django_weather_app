<main id="root" class="flex bg-dark-gray w-[1317px] h-[792px]">
    <div class="flex flex-grow relative my-9 mx-[30px]">
        <c-sidebar.main />
        <div id="content" class="flex w-full">
            {% if action == "login" %}
                <c-auth.login />
            {% elif action == "signup" %}
                <c-auth.signup />
            {% else %}
                <c-weather />
            {% endif %}
        </div>
    </div>
</main>
