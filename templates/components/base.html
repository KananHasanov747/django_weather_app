<main id="root" class="flex bg-dark-gray">
    <div class="flex flex-grow relative py-6 px-7.5 min-h-dvh">
        <c-sidebar.main />
        <div id="content" class="flex flex-col w-full">
            {% if action == "login" %}
                <c-auth.login />
            {% elif action == "signup" %}
                <c-auth.signup />
            {% else %}
                <c-weather />
            {% endif %}
        </div>
    </div>
</main>
