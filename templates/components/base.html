<main id="root" class="flex mx-auto min-w-[24rem] max-w-[90rem] min-h-dvh">
    <div class="flex flex-grow relative py-6 px-7.5">
        <c-sidebar.main />
        <div id="content"
             class="flex flex-col w-full"
             x-data="{ data: {{ data|to_json }}, updateWeather(data) { this.data = data } }">
            {% if auth_action %}
                <c-auth />
            {% elif weather_action %}
                <c-weather />
            {% endif %}
        </div>
    </div>
</main>
