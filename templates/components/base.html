<main id="root"
      class="flex mx-auto min-w-[24rem] max-w-[90rem] min-h-[30rem]">
    <div class="flex flex-grow relative py-6 px-7.5">
        <c-sidebar.main />
        <div id="content" class="flex flex-col w-full">
            {% if auth_action %}
                <c-auth />
            {% elif weather_action %}
                <c-weather />
            {% endif %}
        </div>
    </div>
</main>
