<c-sidebar.menu />
<div id="auth"
     class="flex flex-col w-full h-full px-5.5 items-center justify-center">
    <form id="signup"
          hx-post="{% url 'users:signup' %}"
          hx-target="#content"
          hx-swap="innerHTML"
          hx-push-url="true"
          class="flex flex-col gap-4 w-[280px]">
        {% csrf_token %}
        {% for field in form %}{{ field }}{% endfor %}
        <div class="w-full grid grid-flow-col grid-cols-2 gap-2">
            <button type="submit"
                    class="rounded-[.6rem] cursor-pointer py-2 bg-light-gray text-light-white">SignUp</button>
            <button type="button"
                    class="rounded-[.6rem] cursor-pointer py-2 bg-light-gray text-light-white"
                    hx-get="{% url 'users:login' %}"
                    hx-target="#content"
                    hx-swap="innerHTML"
                    hx-push-url="true">Login</button>
        </div>
    </form>
</div>
