{% load static %}
<div class="flex w-full">
    <div class="flex flex-col w-full px-5 2md:px-7 py-6 bg-light-gray rounded-3xl">
        <h1 class="text-[.813rem] leading-[1.125rem] text-dark-white font-semibold mb-4">TODAY'S FORECAST</h1>
        <div class="grid grid-cols-6">
            <template x-for="(hourly, index) in data.hourly">
                <div class="flex">
                    <div x-show="index !== 0" class="flex bg-slate-600 h-full w-[.031rem]"></div>
                    <div class="flex mx-auto flex-col items-center">
                        <span class="text-sm text-dark-white font-semibold" x-text="hourly.date"></span>
                        <span class="max-w-8 max-h-8 xl:max-w-15 xl:max-h-15">
                            <picture>
                                <source :srcset="hourly.icon_url.webp" type="image/webp">
                                <img :src="hourly.icon_url.png" :alt="hourly.description" />
                            </picture>
                        </span>
                        <span class="text-2xl text-light-white" x-text="hourly.temperature + '°'"></span>
                    </div>
                </div>
            </template>
        </div>
    </div>
</div>
