<div class="flex flex-col w-full px-5 sm:px-7 py-6 bg-light-gray rounded-3xl">
    <h1 class="text-[13px] leading-[18px] text-dark-white font-semibold mb-5">7-DAY FORECAST</h1>
    <div class="h-full grid grid-rows-7 gap-auto">
        <template x-for="(daily, index) in data.daily">
            <div class="w-full">
                <div x-show="index !== 0" class="flex bg-gray-600 w-full h-[.5px]"></div>
                <div class="grid grid-cols-3 items-center">
                    <span class="text-base text-dark-white font-light"
                          x-text="index === 0 ? 'Today' : daily.day_of_week"></span>
                    <div class="mx-auto">
                        <picture>
                            <source :srcset="daily.icon_url.webp" type="image/webp">
                            <img :src="daily.icon_url.png" :alt="daily.description" class="w-20 h-20" />
                        </picture>
                    </div>
                    <div class="text-right text-base text-dark-white">
                        <span class="text-light-white font-semibold"
                              x-text="daily.temperature_max + '°'"></span>/
                        <span class="text-dark-white font-light"
                              x-text="daily.temperature_min + '°'"></span>
                    </div>
                </div>
            </div>
        </template>
    </div>
</div>
