server {
    listen 443 ssl;
    server_name weather.com;

    ssl_certificate /etc/ssl/certs/weather.com-cert.pem;
    ssl_certificate_key /etc/ssl/certs/weather.com-key.pem;

    access_log off;
    error_log /var/log/nginx/error.log;

    location /static/ {
        alias /usr/share/nginx/html/static/;

        # Enable Gzip and Brotli static compression (requires pre-compressed files)
        gzip_static on;       # Serve .gz files if they exist
 
        # Cache control for static assets
        expires 1y;
        add_header Cache-Control "public, immutable";

    }

    location / {
        proxy_pass https://app:8443;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (if using Daphne/WebSockets)
        # proxy_set_header Upgrade $http_upgrade;
        # proxy_set_header Connection "upgrade";
    }


    # Optional: Configure compression settings (for dynamic content)
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_proxied any;
    gzip_comp_level 6;
}
