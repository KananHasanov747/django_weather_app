limit_req_zone $binary_remote_addr zone=main:20m rate=10r/s;

server {
    listen 80;
    server_name localhost;

    limit_req zone=main burst=5 nodelay;

    access_log off;
    error_log /var/log/nginx/error.log;


    location /static/ {
        alias /usr/share/nginx/html/static/;

        # Enable Gzip static compression (requires pre-compressed files)
        gzip_static on;       # Serve .gz files if they exist
 
        # Cache control for static assets
        expires 1y;
        add_header Cache-Control "public, immutable";

    }

    location / {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    # Optional: Configure compression settings (for dynamic content)
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_proxied any;
    gzip_comp_level 6;
}
